name: Run Netlify daily automation

on:
  schedule:
    - cron: "5 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  daily:
    if: ${{ vars.DAILY_CRON_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call daily cron endpoint
        env:
          NETLIFY_SITE_URL: ${{ vars.NETLIFY_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$NETLIFY_SITE_URL" || { echo "Missing NETLIFY_SITE_URL Actions variable"; exit 1; }
          test -n "$CRON_SECRET" || { echo "Missing CRON_SECRET Actions secret"; exit 1; }
          case "$NETLIFY_SITE_URL" in
            https://*) ;;
            *) echo "NETLIFY_SITE_URL must use HTTPS"; exit 1 ;;
          esac
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 300 \
            --retry 3 \
            --retry-delay 5 \
            --retry-all-errors \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${NETLIFY_SITE_URL%/}/api/cron/daily"
