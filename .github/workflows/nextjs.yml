# Manual deployment to Vercel
name: Deploy Next.js site to Vercel

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "vercel-production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Vercel credentials
        run: |
          test -n "$VERCEL_TOKEN" || { echo "Missing VERCEL_TOKEN secret"; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo "Missing VERCEL_ORG_ID secret"; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo "Missing VERCEL_PROJECT_ID secret"; exit 1; }
      - name: Pull Vercel project settings
        run: npx --yes vercel@63.1.2 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build with Vercel
        run: npx --yes vercel@63.1.2 build --yes --prod --token="$VERCEL_TOKEN"
      - name: Deploy to Vercel
        run: npx --yes vercel@63.1.2 deploy --yes --prebuilt --prod --token="$VERCEL_TOKEN"
