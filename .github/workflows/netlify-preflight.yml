name: Netlify hosting preflight

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "setup/netlify-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
