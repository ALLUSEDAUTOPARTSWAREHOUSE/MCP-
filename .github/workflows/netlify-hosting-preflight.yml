name: Netlify hosting preflight

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "setup/netlify-*"
      - "fix/netlify-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netlify-hosting-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Install, lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack and verify pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Production build
        run: pnpm build
